server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Frontenden anropar /api relativt. I containern måste nginx därför skicka vidare
  # de anropen till mock-API:t som körs på värddatorn.
  location /api/ {
    proxy_pass http://host.docker.internal:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single page-app: okända adresser (t.ex. /bokningar efter en omladdning) får index.html,
  # så att Vue Router kan visa rätt sida. Utan raden svarar nginx 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
